<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DGMC rig review</title><style>body{margin:0;background:#172c39}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';import {loadFootballers} from '../src/player-model.js';
const players=await loadFootballers(),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,30),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor(0x172c39);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd9efff,0x6b7c53,2.7));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(2,6,4);scene.add(key);scene.add(players.striker.root,players.keeper.root);players.striker.root.position.x=-.7;players.keeper.root.position.x=.7;camera.position.set(0,1.25,4.6);camera.lookAt(0,1,0);
window.review=(pose,t=0,dir=1)=>{players.striker.pose(pose,t,dir);players.keeper.pose(pose,t,dir);renderer.render(scene,camera);return {striker:players.striker.deformationStats(),keeper:players.keeper.deformationStats()}};review('ready');
</script></body></html>
